name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npx nest build api
      - run: npx nest build worker
      - run: npm test